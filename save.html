<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Gem i OpenCase</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/api.js"></script>
    <link rel="stylesheet" href="resources/styles/panel.css">
    <link rel="stylesheet" href="resources/styles/document-form.css">

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin: 0;
            padding: 16px 20px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #222;
        }

        #form {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }

        .file-info {
            flex: none;
            margin-bottom: 14px;
            padding: 8px 10px;
            border-radius: 3px;
            background: #f5f5f5;
            color: #444;
        }

        .file-info.problem {
            background: #fdecea;
            color: #8a1f11;
        }

        #status {
            flex: none;
            margin-top: 10px;
            min-height: 1.2em;
            color: #555;
        }

        #status.problem {
            color: #c0392b;
        }

        .login {
            margin-top: 8px;
            padding: 6px 14px;
            border: 1px solid #1f6fb2;
            border-radius: 3px;
            background: #1f6fb2;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="file-info" id="file-info">Undersøger dokumentet...</div>

    <!-- Filled by scripts/document-form.js: the Info and Afsendere/modtagere tabs. -->
    <form id="form" novalidate></form>

    <div id="status" aria-live="polite"></div>

    <script src="scripts/panel.js"></script>
    <script src="scripts/contacts.js"></script>
    <script src="scripts/document-form.js"></script>
    <script src="scripts/save-window.js"></script>
</body>
</html>
