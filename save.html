<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Gem i OpenCase</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/api.js"></script>

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin: 0;
            padding: 16px 20px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #222;
        }

        #form {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }

        .field {
            margin-bottom: 12px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .field {
            flex: 1;
            min-width: 0;
        }

        label,
        .label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .required::after {
            content: " *";
            color: #c0392b;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 5px 7px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font: inherit;
            background: #fff;
        }

        input:focus,
        select:focus,
        .editor:focus {
            outline: 2px solid #9cc3e8;
            outline-offset: -1px;
        }

        .invalid {
            border-color: #c0392b;
        }

        .error {
            margin-top: 3px;
            font-size: 12px;
            color: #c0392b;
        }

        .error:empty {
            display: none;
        }

        .hint {
            margin-top: 3px;
            font-size: 12px;
            color: #777;
        }

        .hint:empty {
            display: none;
        }

        .file-info {
            margin-bottom: 14px;
            padding: 8px 10px;
            border-radius: 3px;
            background: #f5f5f5;
            color: #444;
        }

        .file-info.problem {
            background: #fdecea;
            color: #8a1f11;
        }

        /* Case picker */
        .case-picker {
            position: relative;
        }

        #case-results {
            position: absolute;
            z-index: 10;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            margin: 2px 0 0;
            padding: 0;
            list-style: none;
            border: 1px solid #bbb;
            border-radius: 3px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        #case-results[hidden] {
            display: none;
        }

        .case-option {
            padding: 6px 8px;
            cursor: pointer;
        }

        .case-option .sub {
            font-size: 12px;
            color: #777;
        }

        .case-option.active {
            background: #e4eef8;
        }

        .case-option[aria-disabled="true"] {
            color: #aaa;
            cursor: default;
        }

        .case-option[aria-disabled="true"] .sub {
            color: #bbb;
        }

        .case-message {
            padding: 6px 8px;
            color: #777;
        }

        .selected-case {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 7px;
            border: 1px solid #bbb;
            border-radius: 3px;
            background: #f0f5ff;
        }

        .selected-case span {
            flex: 1;
            min-width: 0;
        }

        .link-button {
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            color: #1f6fb2;
            cursor: pointer;
        }

        /* Rich text editor */
        .toolbar {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid #bbb;
            border-bottom: 0;
            border-radius: 3px 3px 0 0;
            background: #f5f5f5;
        }

        .toolbar button {
            min-width: 28px;
            height: 26px;
            border: 1px solid transparent;
            border-radius: 3px;
            background: none;
            font: inherit;
            cursor: pointer;
        }

        .toolbar button:hover,
        .toolbar button:focus-visible {
            border-color: #ccc;
            background: #fff;
        }

        .editor {
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 0 0 3px 3px;
        }

        .editor p {
            margin: 0 0 6px;
        }

        #status {
            flex: none;
            margin-top: 10px;
            min-height: 1.2em;
            color: #555;
        }

        #status.problem {
            color: #c0392b;
        }

        .login {
            margin-top: 8px;
            padding: 6px 14px;
            border: 1px solid #1f6fb2;
            border-radius: 3px;
            background: #1f6fb2;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <form id="form" novalidate>
        <div class="file-info" id="file-info">Undersøger dokumentet...</div>

        <div class="field">
            <label class="required" for="case-search">Sag</label>
            <div class="case-picker">
                <div class="selected-case" id="selected-case" hidden>
                    <span id="selected-case-text"></span>
                    <button class="link-button" id="change-case" type="button">Skift</button>
                </div>
                <input id="case-search" type="text" autocomplete="off" placeholder="Søg på sagsnummer eller titel"
                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="case-results">
                <ul id="case-results" role="listbox" hidden></ul>
            </div>
            <div class="error" id="case-error"></div>
        </div>

        <div class="field">
            <label class="required" for="title">Titel</label>
            <input id="title" type="text" autocomplete="off">
            <div class="error" id="title-error"></div>
        </div>

        <div class="row">
            <div class="field">
                <label class="required" for="category">Dokumentkategori</label>
                <select id="category">
                    <option value="">Vælg...</option>
                </select>
                <div class="error" id="category-error"></div>
            </div>

            <div class="field">
                <label for="document-type">Dokumenttype</label>
                <select id="document-type">
                    <option value="">(Ingen)</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label for="insight-level">Indsigtsgrad</label>
            <select id="insight-level">
                <option value="">Sagens indsigtsgrad</option>
            </select>
            <div class="hint" id="insight-level-hint"></div>
        </div>

        <div class="row">
            <div class="field">
                <label for="document-date">Dokumentdato</label>
                <input id="document-date" type="date">
            </div>
            <div class="field">
                <label for="received-date">Modtaget dato</label>
                <input id="received-date" type="date">
            </div>
            <div class="field">
                <label for="registered-date">Registreret dato</label>
                <input id="registered-date" type="date">
            </div>
        </div>

        <div class="field">
            <span class="label" id="summary-label">Dokumentresume</span>
            <div class="toolbar" role="toolbar" aria-label="Formatering">
                <button type="button" data-command="bold" title="Fed (Ctrl+B)"><b>F</b></button>
                <button type="button" data-command="italic" title="Kursiv (Ctrl+I)"><i>K</i></button>
                <button type="button" data-command="underline" title="Understreget (Ctrl+U)"><u>U</u></button>
                <button type="button" data-command="insertUnorderedList" title="Punktopstilling">•</button>
                <button type="button" data-command="insertOrderedList" title="Nummereret liste">1.</button>
            </div>
            <div class="editor" id="summary" contenteditable="true" role="textbox" aria-multiline="true"
                 aria-labelledby="summary-label"></div>
        </div>
    </form>

    <div id="status" aria-live="polite"></div>

    <script src="scripts/save-window.js"></script>
</body>
</html>
