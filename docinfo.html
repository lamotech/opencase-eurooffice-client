<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Dokument info</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/api.js"></script>
    <link rel="stylesheet" href="resources/styles/panel.css">

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin: 0;
            padding: 16px 20px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #222;
        }

        #content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 4px;
        }

        h2 {
            flex: 1;
            margin: 0;
            font-size: 17px;
        }

        .number {
            margin-bottom: 14px;
            color: #666;
        }

        .badge.final {
            background: #dff3e4;
            color: #1e6b34;
        }

        .badge.readonly {
            background: #fdf0d9;
            color: #8a5a00;
        }

        dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 6px 16px;
            margin: 0 0 16px;
        }

        dt {
            color: #666;
        }

        dd {
            margin: 0;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .empty-value {
            color: #aaa;
        }

        h3 {
            margin: 16px 0 6px;
            font-size: 13px;
            text-transform: uppercase;
            color: #666;
        }

        .summary {
            padding: 8px 10px;
            border-radius: 3px;
            background: #f7f7f7;
        }

        .summary p {
            margin: 0 0 6px;
        }

        .files {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .files li {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .current {
            font-weight: bold;
        }

        .file-meta {
            margin-left: auto;
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        /* Favourite star */
        .star {
            flex: none;
            padding: 0 2px;
            border: 0;
            background: none;
            font-size: 20px;
            line-height: 1;
            color: #bbb;
            cursor: pointer;
        }

        .star.on {
            color: #e0a800;
        }

        .star:disabled {
            cursor: default;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select,
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            box-sizing: border-box;
            padding: 4px 6px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font: inherit;
            background: #fff;
        }

        /* Rich text for notes */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 3px;
            border: 1px solid #bbb;
            border-bottom: 0;
            border-radius: 3px 3px 0 0;
            background: #f5f5f5;
        }

        .toolbar button {
            min-width: 28px;
            height: 26px;
            border: 1px solid transparent;
            border-radius: 3px;
            background: none;
            font: inherit;
            cursor: pointer;
        }

        .toolbar button:hover,
        .toolbar button:focus-visible {
            border-color: #ccc;
            background: #fff;
        }

        .editor {
            min-height: 120px;
            max-height: 260px;
            overflow-y: auto;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 0 0 3px 3px;
        }

        .editor:focus {
            outline: 2px solid #9cc3e8;
            outline-offset: -1px;
        }

        #status {
            flex: none;
            margin-top: 10px;
            color: #555;
        }

        #status:empty {
            display: none;
        }

        #status.problem {
            color: #c0392b;
        }
    </style>
</head>

<body>
    <div id="content" aria-live="polite"></div>
    <div id="status">Henter dokumentinformation...</div>

    <script src="scripts/panel.js"></script>
    <script src="scripts/contacts.js"></script>
    <script src="scripts/docinfo-window.js"></script>
</body>
</html>
