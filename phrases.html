<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Fraser</title>

    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/api.js"></script>
    <link rel="stylesheet" href="resources/styles/panel.css">

    <style>
        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            margin: 0;
            padding: 14px 20px 16px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #222;
        }

        h2 {
            flex: none;
            margin: 0 0 10px;
            font-size: 16px;
        }

        #content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }

        .notice {
            margin-bottom: 10px;
            padding: 8px 10px;
            border-left: 3px solid #c77700;
            background: #fff6e5;
            color: #5c3a00;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .search-row input[type="search"] {
            flex: 1;
        }

        input[type="text"],
        input[type="search"],
        select {
            box-sizing: border-box;
            padding: 5px 7px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font: inherit;
            background: #fff;
        }

        input:focus,
        select:focus,
        .editor:focus {
            outline: 2px solid #9cc3e8;
            outline-offset: -1px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            cursor: pointer;
        }

        /* Phrase list */
        .group {
            margin: 12px 0 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #666;
        }

        .phrase {
            padding: 7px 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .phrase:hover,
        .phrase[aria-selected="true"] {
            background: #f0f5ff;
        }

        .phrase .title {
            font-weight: bold;
        }

        .phrase .sub {
            margin-top: 2px;
            font-size: 12px;
            color: #666;
        }

        .phrase .choice {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            cursor: default;
        }

        .badge {
            margin-left: 6px;
            vertical-align: 1px;
            font-weight: normal;
        }

        .badge.draft {
            background: #fff1d6;
            color: #8a5a00;
        }

        .badge.archived {
            background: #eee;
            color: #777;
        }

        .badge.file {
            background: #e4eef8;
            color: #1f4f7a;
        }

        /* Insert: preview */
        .preview {
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background: #fafafa;
        }

        .preview .body > :first-child {
            margin-top: 0;
        }

        /* Phrase form */
        .field {
            margin-bottom: 12px;
        }

        .field > label,
        .label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .field input[type="text"],
        .field select {
            width: 100%;
        }

        .required::after {
            content: " *";
            color: #c0392b;
        }

        .hint {
            margin-top: 4px;
            font-size: 12px;
            color: #777;
        }

        .hint:empty {
            display: none;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .field {
            flex: 1;
            min-width: 0;
        }

        .scopes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
        }

        .scope {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px 2px 8px;
            border-radius: 12px;
            background: #e4eef8;
            font-size: 12px;
        }

        .scope button {
            padding: 0 4px;
            border: 0;
            background: none;
            font: inherit;
            color: #555;
            cursor: pointer;
        }

        .scope-add {
            display: flex;
            gap: 6px;
        }

        .scope-add select:first-child {
            flex: none;
            width: auto;
        }

        .scope-add .value {
            flex: 1;
            min-width: 0;
        }

        .file-choice {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 3px;
            border: 1px solid #bbb;
            border-bottom: 0;
            border-radius: 3px 3px 0 0;
            background: #f5f5f5;
        }

        .toolbar button {
            min-width: 28px;
            height: 26px;
            border: 1px solid transparent;
            border-radius: 3px;
            background: none;
            font: inherit;
            cursor: pointer;
        }

        .toolbar button:hover,
        .toolbar button:focus-visible {
            border-color: #ccc;
            background: #fff;
        }

        .editor {
            min-height: 120px;
            max-height: 240px;
            overflow-y: auto;
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 0 0 3px 3px;
            background: #fff;
        }

        .editor p {
            margin: 0 0 6px;
        }

        .templates-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .templates-list li {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }

        .mismatch {
            display: block;
            font-size: 12px;
            color: #c0392b;
        }

        .meta {
            margin-top: 12px;
            font-size: 12px;
            color: #777;
        }

        .footer {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .footer .actions {
            display: flex;
            flex: none;
            gap: 8px;
        }

        #status {
            flex: 1;
            min-width: 0;
            color: #555;
        }

        #status.problem {
            color: #c0392b;
        }

        #status .button {
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <h2 id="heading">Fraser</h2>
    <div id="content"></div>

    <div class="footer">
        <div id="status" aria-live="polite"></div>
        <div class="actions" id="actions"></div>
    </div>

    <script src="scripts/panel.js"></script>
    <script src="resources/vendor/mammoth/mammoth.browser.min.js"></script>
    <script src="scripts/phrases-window.js"></script>
</body>
</html>
